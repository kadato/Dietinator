# Dependabot configuration for Dietinator
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Strategy: grouped PRs by ecosystem and dependency type matching conventional commit pattern.

version: 2

updates:
  # npm: application dependencies and build tools
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    cooldown:
      default-days: 3
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ["*"]
      deps:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      deps-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "yazio"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "@react-native/jest-preset"
        update-types: ["version-update:semver-minor"]

  # GitHub Actions: CI/CD workflows and automation
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
    groups:
      actions:
        patterns: ["*"]

  # Dev Containers: VS Code / GitHub Codespaces environment
  - package-ecosystem: "devcontainers"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "devcontainer"
    groups:
      devcontainer:
        patterns: ["*"]
