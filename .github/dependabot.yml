version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "react"
          - "react-native*"
          - "babel-*"
          - "typescript"
      tools:
        patterns:
          - "eslint*"
          - "prettier*"
          - "husky"
          - "lint-staged"
          - "playwright*"
          - "@types/*"
    ignore:
      - dependency-name: "yazio"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
