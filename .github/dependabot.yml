version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # Monthly, minor/patch only. Major bumps (Expo SDK, tailwind, jest,
      # gluestack) are deliberate project decisions — they need manual review.
      interval: monthly
    open-pull-requests-limit: 4
    groups:
      expo:
        patterns:
          - "expo"
          - "expo-*"
          - "react"
          - "react-native*"
          - "babel-*"
          - "typescript"
      tools:
        patterns:
          - "eslint*"
          - "prettier*"
          - "husky"
          - "lint-staged"
          - "playwright*"
          - "@types/*"
    ignore:
      - dependency-name: "yazio"
      - update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
