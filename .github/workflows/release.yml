name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.1.0)"
        required: true
        default: "1.1.0"

permissions:
  contents: write

jobs:
  test:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:coverage

  build-android:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
      - run: pnpm install --frozen-lockfile
      - name: Bake version into app.json
        run: node scripts/ci-set-version.cjs ${{ steps.version.outputs.version }}
      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install
      - name: Raise Gradle JVM memory
        # The prebuild template caps Metaspace at 512m, which first-time Expo
        # builds exhaust. gradle.properties ends without a trailing newline, so
        # the append must start with one or it merges into the last property.
        run: printf '\norg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m\n' >> android/gradle.properties
      - name: Decode signing keystore
        run: |
          mkdir -p keystore
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > keystore/dietinator-release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Verify signing keystore
        # Fails in seconds instead of after a ~30 minute build when a secret
        # is wrong. Each check reports which secret is at fault.
        run: |
          STORE=keystore/dietinator-release.keystore
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is not set}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is not set}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is not set}"
          [ -s "$STORE" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file, check the secret"; exit 1; }
          keytool -list -keystore "$STORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1 \
            || { echo "::error::ANDROID_KEYSTORE_PASSWORD does not match the keystore store password"; exit 1; }
          keytool -list -keystore "$STORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" -keypass "$ANDROID_KEY_PASSWORD" >/dev/null 2>&1 \
            || { echo "::error::ANDROID_KEY_ALIAS or ANDROID_KEY_PASSWORD does not match the keystore"; exit 1; }
          echo "Signing keystore verified: store password, alias '$ANDROID_KEY_ALIAS' and key password all match."
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Wire release signing
        run: node scripts/inject-android-signing.cjs
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
        env:
          DIETINATOR_KEYSTORE_FILE: ${{ github.workspace }}/keystore/dietinator-release.keystore
          DIETINATOR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DIETINATOR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DIETINATOR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  create-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [build-android]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi
      - name: Rename APK
        run: mv release/app-release.apk release/Dietinator-Android.apk
      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV=$(git tag --sort=-version:refname | grep -vx "v${VERSION}" | head -1 || true)
          echo "Previous tag: ${PREV:-<none>}"
          RANGE="${PREV:+${PREV}..}HEAD"
          FEATURES=$(git log "$RANGE" --no-merges --pretty=format:%s | grep -E '^feat' | sed -E 's/^feat(\([^)]*\))?: //' | sed 's/^./\U&/' || true)
          FIXES=$(git log "$RANGE" --no-merges --pretty=format:%s | grep -E '^fix' | sed -E 's/^fix(\([^)]*\))?: //' | sed 's/^./\U&/' || true)
          {
            echo "## What's new"
            echo ""
            if [ -n "$FEATURES" ]; then
              echo "### Features"
              echo "$FEATURES" | sed 's/^/- /'
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### Bug fixes"
              echo "$FIXES" | sed 's/^/- /'
              echo ""
            fi
            if [ -z "$FEATURES" ] && [ -z "$FIXES" ]; then
              echo "Improvements and under-the-hood changes."
              echo ""
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
      - name: Append APK checksum
        run: |
          {
            echo ""
            echo "## Verify the download"
            echo ""
            echo '```text'
            sha256sum release/Dietinator-Android.apk
            echo '```'
          } >> RELEASE_NOTES.md
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Dietinator v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: release/Dietinator-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
