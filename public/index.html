<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Inlined app shell: paints a themed loading screen before the bundle parses.
         The app hides it via `data-shell-hide` once React has rendered. -->
    <style>
      #app-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f1f5f9;
      }
      @media (prefers-color-scheme: dark) {
        #app-shell {
          background: #141416;
        }
      }
      .app-shell-spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid rgba(13, 148, 136, 0.25);
        border-top-color: #0d9488;
        animation: app-shell-spin 0.8s linear infinite;
      }
      @keyframes app-shell-spin {
        to {
          transform: rotate(360deg);
        }
      }
      html[data-shell-hide] #app-shell {
        display: none;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <div id="app-shell" aria-hidden="true">
      <div class="app-shell-spinner"></div>
    </div>
  </body>
</html>
